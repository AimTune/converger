{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "converger.fullname" . }}
  labels:
    {{- include "converger.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "converger.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.httpFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if ne .Values.cluster.strategy "none" }}
    # Erlang distribution between Converger pods.
    - from:
        - podSelector:
            matchLabels:
              {{- include "converger.selectorLabels" . | nindent 14 }}
      {{- if .Values.cluster.distributionPort }}
      ports:
        - port: 4369
          protocol: TCP
        - port: {{ .Values.cluster.distributionPort }}
          protocol: TCP
      {{- end }}
    {{- end }}
{{- end }}
