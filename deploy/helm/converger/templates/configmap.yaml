apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "converger.fullname" . }}
  labels:
    {{- include "converger.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  CLUSTER_STRATEGY: {{ .Values.cluster.strategy | quote }}
  {{- if eq .Values.cluster.strategy "kubernetes_dns" }}
  CLUSTER_SERVICE: {{ printf "%s-headless.%s.svc.cluster.local" (include "converger.fullname" .) .Release.Namespace | quote }}
  {{- end }}
  CLUSTER_NODE_BASENAME: {{ .Values.cluster.nodeBasename | quote }}
