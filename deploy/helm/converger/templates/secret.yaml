{{- if .Values.secret.create }}
# Rendered only with secret.create=true. With migrations enabled it is a
# pre-install/pre-upgrade hook (weight -10) so that it exists before the
# migration Job; Helm does not delete hook resources on uninstall.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "converger.fullname" . }}
  labels:
    {{- include "converger.labels" . | nindent 4 }}
  {{- if .Values.migrations.enabled }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secret.databaseUrl is required with secret.create=true" .Values.secret.databaseUrl | quote }}
  SECRET_KEY_BASE: {{ required "secret.secretKeyBase is required with secret.create=true" .Values.secret.secretKeyBase | quote }}
  CLOAK_KEY: {{ required "secret.cloakKey is required with secret.create=true" .Values.secret.cloakKey | quote }}
  {{- if ne .Values.cluster.strategy "none" }}
  RELEASE_COOKIE: {{ required "secret.releaseCookie is required with secret.create=true and clustering" .Values.secret.releaseCookie | quote }}
  {{- else if .Values.secret.releaseCookie }}
  RELEASE_COOKIE: {{ .Values.secret.releaseCookie | quote }}
  {{- end }}
  {{- with .Values.secret.metricsToken }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
