apiVersion: apps/v1
kind: Deployment
metadata:
  name: converger
  labels:
    app.kubernetes.io/name: converger
    app.kubernetes.io/component: server
spec:
  # The HPA (hpa.yaml) owns the replica count after the first apply.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: converger
      app.kubernetes.io/component: server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A new pod must be ready (/health/ready) before an old one goes.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: converger
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: converger
      automountServiceAccountToken: false
      # preStop sleep (5 s) + WS_DRAIN_DELAY_MS (5 s) + socket drain
      # (WS_DRAIN_SHUTDOWN_MS, up to 30 s) + Oban shutdown.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: converger
              app.kubernetes.io/component: server
      containers:
        - name: converger
          image: ghcr.io/aimtune/converger
          imagePullPolicy: IfNotPresent
          # The image's default command (/app/bin/server): starts the
          # release, never migrates (see migrate-job.yaml).
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
            - name: epmd
              containerPort: 4369
              protocol: TCP
          env:
            # Node name converger@<pod IP> (rel/env.sh.eex), the form the
            # Kubernetes.DNS strategy expects.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - configMapRef:
                name: converger-config
            - secretRef:
                name: converger-env
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            # 503 while the database is unreachable, Oban is down, a
            # migration is pending or the pod is shutting down.
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              # Give the endpoints controller and the ingress time to stop
              # routing to this pod before the release receives SIGTERM.
              exec:
                command: ["/bin/sleep", "5"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
