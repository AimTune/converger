# Scale on CPU. Needs metrics-server. Keep maxReplicas x POOL_SIZE (plus the
# migration Job) below Postgres max_connections.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: converger
  labels:
    app.kubernetes.io/name: converger
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: converger
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Scale in slowly: every removed pod drops its WebSocket connections.
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
