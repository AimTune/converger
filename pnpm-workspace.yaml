# pnpm workspace for the JavaScript/TypeScript packages of this repository.
# The Elixir server does not depend on it.
packages:
  - "packages/*"
  - "examples/typescript/*"
  - "examples/agents/*"

# Dependencies allowed to run install scripts.
allowBuilds:
  esbuild: true

# Security overrides for transitive dependencies (Dependabot alerts).
overrides:
  esbuild: ">=0.28.1"
