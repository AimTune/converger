name: OSS Scanner image

# Converger is enrolled in Anthropic's OSS Scanner (docs/security/oss-scanner.md,
# ADR-0078). The scanner builds .oss-scanner/Dockerfile from a clone of main and
# then runs with no network; a broken build is only noticed when the security
# contact gets an email. This job builds the same image and runs the suite
# offline whenever the build inputs change, and weekly for dependency drift.
on:
  pull_request:
    paths:
      - ".oss-scanner/**"
      - ".dockerignore"
      - ".tool-versions"
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/oss-scanner.yml"
  push:
    branches: [main]
    paths:
      - ".oss-scanner/**"
      - ".dockerignore"
      - ".tool-versions"
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/oss-scanner.yml"
  schedule:
    # Mondays 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: oss-scanner-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test offline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the scanner image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .oss-scanner/Dockerfile
          push: false
          load: true
          tags: converger-oss-scanner:ci
          cache-from: type=gha,scope=oss-scanner
          cache-to: type=gha,scope=oss-scanner,mode=max

      - name: Run the suite with no network
        run: |
          docker run --rm --network none converger-oss-scanner:ci \
            .oss-scanner/with-postgres.sh mix test --warnings-as-errors
