name: client-ts publish

# Publishes @converger/client to npm when a tag client-ts-vX.Y.Z is pushed.
# The tag must match packages/client-ts/package.json "version". Publishes with
# npm trusted publishing (OIDC): no token is stored. The package has a trusted
# publisher on npmjs.com for AimTune/converger, this workflow file and the "npm"
# environment; provenance is attached automatically.

on:
  push:
    tags: ["client-ts-v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish @converger/client
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      # npm trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships 10.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile --filter @converger/client...

      - name: Tag matches package version
        working-directory: packages/client-ts
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "client-ts-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi

      - run: pnpm --filter @converger/client typecheck
      - run: pnpm --filter @converger/client test
      - run: pnpm --filter @converger/client build

      # npm publish, not pnpm publish: the npm CLI does the OIDC exchange.
      - name: Publish
        working-directory: packages/client-ts
        run: npm publish --access public
