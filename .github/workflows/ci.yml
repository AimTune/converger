name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MIX_ENV: test
  # Keep in sync with the Dockerfile's ELIXIR_VERSION / OTP_VERSION and .tool-versions.
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.5.0.5"

jobs:
  lint:
    name: Format, compile, Credo, Sobelow, audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Check for unused dependencies in mix.lock
        run: mix deps.unlock --check-unused

      - name: Compile (warnings as errors)
        # --force so cached _build artifacts cannot hide warnings.
        run: mix compile --warnings-as-errors --force

      - name: Credo
        run: mix credo --strict

      - name: Sobelow
        run: mix sobelow --config

      - name: Retired Hex packages
        run: mix hex.audit

      - name: Known vulnerabilities in dependencies
        run: mix deps.audit

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-dev-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-dev-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      # PLTs are expensive to build; cache them separately and always save
      # (even if Dialyzer reports warnings) so the next run is incremental.
      - name: Restore PLT cache
        id: plt-cache
        uses: actions/cache/restore@v6
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      - name: Build PLTs
        if: steps.plt-cache.outputs.cache-hit != 'true'
        run: mkdir -p priv/plts && mix dialyzer --plt

      - name: Save PLT cache
        if: steps.plt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: priv/plts
          key: ${{ steps.plt-cache.outputs.cache-primary-key }}

      - name: Run Dialyzer
        run: mix dialyzer --format github

  test:
    name: Test suite (coverage)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors

      - name: Run tests with coverage
        # --warnings-as-errors also fails the run on warnings in test files.
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          mix coveralls.multiple --type local --type json --type lcov --warnings-as-errors | tee coverage.txt
          exit "${PIPESTATUS[0]}"
        shell: bash

      - name: Coverage summary
        if: always() && hashFiles('coverage.txt') != ''
        shell: bash
        run: |
          {
            echo "## Test coverage"
            echo
            grep -E '^\[TOTAL\]' coverage.txt | sed 's/^/**/; s/$/**/' || true
            echo
            echo "<details><summary>Per-module coverage</summary>"
            echo
            echo '```'
            sed -n '/^----------------$/,/^\[TOTAL\]/p' coverage.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && hashFiles('cover/excoveralls.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            cover/excoveralls.json
            cover/lcov.info
          if-no-files-found: ignore

      # Optional: set the CODECOV_TOKEN repository secret to also get Codecov
      # PR comments and status checks. Without it this step is skipped.
      - name: Upload to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v7
        with:
          files: cover/lcov.info
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false

  storage-integration:
    name: Storage integration (MinIO, Azurite)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

      # The upstream minio/minio image is no longer published on Docker Hub;
      # the Bitnami build runs the same server and needs no command override.
      minio:
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fs http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20

      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports: ["10000:10000"]

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix deps.get
      - run: mix compile

      - name: Run MinIO / Azurite tests
        env:
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          AZURITE_ENDPOINT: http://127.0.0.1:10000/devstoreaccount1
        run: mix test test/converger/uploads/storage_integration_test.exs --only minio --only azurite
