name: agent-ts publish

# Publishes @converger/agent and create-converger-agent to npm. Manual only
# (workflow_dispatch), a dry run by default: nothing is published
# automatically. The version input must equal both packages' package.json
# "version". Needs the NPM_TOKEN repository secret; published with provenance.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must equal the packages' package.json version)"
        required: true
      dry_run:
        description: "Pack and check only, do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish @converger/agent and create-converger-agent
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile --filter "@converger/agent..." --filter "create-converger-agent..."

      - name: Version matches the packages
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for dir in packages/agent-ts packages/create-converger-agent; do
            version=$(node -p "require('./${dir}/package.json').version")
            if [ "${version}" != "${VERSION}" ]; then
              echo "::error::${dir} is ${version}, not ${VERSION}"
              exit 1
            fi
          done

      - run: pnpm --filter @converger/agent typecheck
      - run: pnpm --filter @converger/agent test
      - run: pnpm --filter @converger/agent build
      - run: pnpm --filter create-converger-agent test

      - name: Publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flags=(--no-git-checks --access public)
          if [ "${DRY_RUN}" = "true" ]; then flags+=(--dry-run); fi
          pnpm --filter @converger/agent publish "${flags[@]}"
          pnpm --filter create-converger-agent publish "${flags[@]}"
