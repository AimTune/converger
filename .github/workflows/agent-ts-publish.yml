name: agent-ts publish

# Publishes @converger/agent and create-converger-agent to npm. Manual only
# (workflow_dispatch), a dry run by default: nothing is published
# automatically. The version input must equal both packages' package.json
# "version". Publishes with npm trusted publishing (OIDC): no token is stored.
# Each package has a trusted publisher on npmjs.com for AimTune/converger, this
# workflow file and the "npm" environment; provenance is attached
# automatically.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must equal the packages' package.json version)"
        required: true
      dry_run:
        description: "Pack and check only, do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish @converger/agent and create-converger-agent
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      # npm trusted publishing (OIDC) needs npm 11.5.1 or newer; Node 22 ships 10.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile --filter "@converger/agent..." --filter "create-converger-agent..."

      - name: Version matches the packages
        shell: bash
        env:
          EXPECTED: ${{ inputs.version }}
        run: |
          for dir in packages/agent-ts packages/create-converger-agent; do
            version=$(node -p "require('./${dir}/package.json').version")
            if [ "${version}" != "${EXPECTED}" ]; then
              echo "::error::${dir} is ${version}, not ${EXPECTED}"
              exit 1
            fi
          done

      - run: pnpm --filter @converger/agent typecheck
      - run: pnpm --filter @converger/agent test
      - run: pnpm --filter @converger/agent build
      - run: pnpm --filter create-converger-agent test

      # npm publish, not pnpm publish: the npm CLI does the OIDC exchange. Neither
      # package has workspace: dependencies, so publishing the folder is the
      # same tarball. @converger/agent goes first: the scaffolder's template
      # depends on it.
      - name: Publish
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        # A version already on npm is skipped, so a run that failed halfway
        # (e.g. one package without its trusted publisher yet) can be re-run.
        run: |
          flags=(--access public)
          if [ "${DRY_RUN}" = "true" ]; then flags+=(--dry-run); fi
          for dir in packages/agent-ts packages/create-converger-agent; do
            name=$(node -p "require('./${dir}/package.json').name")
            version=$(node -p "require('./${dir}/package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already on npm, skipping"
              continue
            fi
            (cd "${dir}" && npm publish "${flags[@]}")
          done
