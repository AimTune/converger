name: Load

# k6 load harness (load/, docs/benchmarks/index.md): REST -> WebSocket
# fan-out, inbound webhook burst, idle sockets, reconnect storm, rolling
# restart and node kill, on 1 and 3 nodes, with the Native and the Kafka
# event backbone (#66). Publishes each report as the job summary and an
# artifact, and fails on lost acked messages, failed correctness thresholds,
# events the backbone subscriber did not observe exactly once, or a p95
# regression of more than 15 % against the committed baseline for this
# runner (load/baselines/). The `matrix` job renders the backbone x nodes
# table (docs/benchmarks/backbone-matrix.md); the nightly run opens a pull
# request with it.
on:
  pull_request:
    paths:
      - "load/**"
      - ".github/workflows/load.yml"
  workflow_dispatch:
    inputs:
      profile:
        description: full or smoke
        default: full
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    name: Load (${{ matrix.backbone }}, ${{ matrix.nodes }} node${{ matrix.nodes == 3 && 's' || '' }})
    # Fixed runner size: baselines are only comparable on the same hardware
    # (recorded in every report).
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # One run at a time per runner pool is not guaranteed; each run is its
      # own VM, so runs do not share CPU.
      matrix:
        backbone: [native, kafka]
        nodes: [1, 3]

    steps:
      - uses: actions/checkout@v7

      - name: Run load harness
        env:
          LOAD_NODES: ${{ matrix.nodes }}
          LOAD_BACKBONE: ${{ matrix.backbone }}
          LOAD_PROFILE: ${{ inputs.profile || 'full' }}
        run: bash load/run.sh

      - name: Compare with baseline
        if: always() && hashFiles('load/.run/out/results.json') != ''
        run: |
          baseline="load/baselines/ubuntu-24.04-${{ matrix.backbone }}-${{ matrix.nodes }}node.json"
          args=()
          if [ -f "$baseline" ] && [ "${{ inputs.profile || 'full' }}" = "full" ]; then
            args=(--baseline "$baseline")
          else
            echo "::notice::no baseline for this runner, backbone and profile ($baseline); comparison skipped"
          fi
          code=0
          node load/report.js "${args[@]}" --out load/.run/out/comparison.md load/.run/out/results.json || code=$?
          cat load/.run/out/comparison.md >>"$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-results-${{ matrix.backbone }}-${{ matrix.nodes }}node
          # Only the results directory: the generated .env stays behind.
          path: load/.run/out/
          if-no-files-found: ignore

  matrix:
    name: Backbone matrix
    needs: load
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: load-results-*
          path: load/.run/matrix

      - name: Render the backbone x nodes table
        run: |
          shopt -s nullglob
          files=(load/.run/matrix/load-results-*/results.json)
          if [ "${#files[@]}" = 0 ]; then
            echo "::warning::no results to render"
            exit 0
          fi
          code=0
          node load/report.js --title "Backbone matrix" --out load/.run/matrix/report.md "${files[@]}" || code=$?
          cat load/.run/matrix/report.md >>"$GITHUB_STEP_SUMMARY"
          bash load/publish_matrix.sh load/.run/matrix/report.md \
            "Measured by the nightly \`Load\` workflow on GitHub's \`ubuntu-24.04\` runners ($(date -u +%Y-%m-%d), commit \`$(git rev-parse --short=12 HEAD)\`, profile \`${{ inputs.profile || 'full' }}\`)."
          exit "$code"

      - name: Upload the table
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backbone-matrix
          path: |
            load/.run/matrix/report.md
            docs/benchmarks/backbone-matrix.md
          if-no-files-found: ignore

      # Nightly only: propose the regenerated page as a pull request.
      - name: Open a pull request with the table
        if: github.event_name == 'schedule' && hashFiles('load/.run/matrix/report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/benchmarks/backbone-matrix.md; then
            echo "table unchanged"
            exit 0
          fi
          branch="bench/backbone-matrix-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add docs/benchmarks/backbone-matrix.md
          git commit -m "docs(benchmarks): nightly backbone matrix $(date -u +%Y-%m-%d)"
          git push -f origin "$branch"
          gh pr create --head "$branch" --title "docs(benchmarks): nightly backbone matrix" \
            --body "Regenerated by the nightly Load workflow (load/matrix.sh table, docs/benchmarks/backbone-matrix.md)." \
            || echo "pull request already open"
