version: 2

updates:
  - package-ecosystem: mix
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Dev/test-only tooling rarely needs individual review.
      dev-tooling:
        patterns:
          - credo
          - dialyxir
          - sobelow
          - mix_audit
          - excoveralls

  - package-ecosystem: npm
    directory: "/converger_js"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
