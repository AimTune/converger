version: 2

updates:
  - package-ecosystem: mix
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Dev/test-only tooling rarely needs individual review.
      dev-tooling:
        patterns:
          - credo
          - dialyxir
          - sobelow
          - mix_audit
          - excoveralls

  # pnpm workspace: packages/client-ts (@converger/client) and examples/typescript/*.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      sdk-dev-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Docusaurus packages must move in lockstep.
      docusaurus:
        patterns:
          - "@docusaurus/*"
