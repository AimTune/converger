# Kafka as the event backbone for the load harness (issue #66), layered by
# load/run.sh when LOAD_BACKBONE=kafka. A single-node KRaft broker on the
# compose network; the nodes switch backbone with one variable, BACKBONE.
# For three nodes run.sh also adds load/docker-compose.load-kafka-cluster.yml.
x-kafka-backbone: &kafka_backbone
  BACKBONE: kafka
  BACKBONE_KAFKA_BROKERS: kafka:9092
  BACKBONE_KAFKA_PARTITIONS: ${LOAD_KAFKA_PARTITIONS:-12}

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  app:
    environment:
      <<: *kafka_backbone
    depends_on:
      kafka:
        condition: service_healthy
