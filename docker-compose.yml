# Secrets are never committed. Copy .env.example to .env and fill it in;
# `docker compose up` refuses to start while a required variable is unset.
# See docs/deployment.md.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Copy .env.example to .env and fill in the secrets (see docs/deployment.md)}
      POSTGRES_DB: converger_dev
    ports:
      # Published on loopback only; the app reaches Postgres over the compose network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot migration step: runs to completion before `app` starts.
  # Converger.Release.migrate/0 holds a Postgres advisory lock, so even
  # concurrent runs apply each migration exactly once.
  migrate:
    build: .
    image: converger:local
    depends_on:
      db:
        condition: service_healthy
    command: ["/app/bin/migrate"]
    environment: &app_env
      DATABASE_URL: ecto://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Copy .env.example to .env and fill in the secrets (see docs/deployment.md)}@db/converger_prod
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is not set. Copy .env.example to .env and generate one with mix phx.gen.secret}
      CLOAK_KEY: ${CLOAK_KEY:?CLOAK_KEY is not set. Copy .env.example to .env and generate one with openssl rand -base64 32}
      CREATE_DB: "true"
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: "4000"
      PROMETHEUS_PORT: "9568"
      # Local compose serves plain HTTP. Set FORCE_SSL=true (and
      # TRUSTED_PROXIES) when running behind a TLS-terminating proxy.
      FORCE_SSL: ${FORCE_SSL:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

  app:
    build: .
    image: converger:local
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
      - "9568:9568"
    environment:
      <<: *app_env
      CREATE_DB: "false"
      PHX_SERVER: "true"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is not set. Copy .env.example to .env and choose a Grafana admin password}
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  otel-collector:
    image: otel/opentelemetry-collector:latest
    volumes:
      - ./docker/otel-collector/otel-config.yml:/etc/otel-collector-config.yaml
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    ports:
      - "4318:4318" # OTLP http receiver
      - "8889:8889" # Prometheus exporter metrics
    depends_on:
      - jaeger

volumes:
  postgres_data:
